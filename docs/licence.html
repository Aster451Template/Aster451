<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aster451 Template Docs</title>
    <link rel="stylesheet" href="./aster451.css">
    <script src="./aster451.js" defer></script>
</head>

<body>

    <a class="skip-link" href="#content">本文へスキップ</a>

    <header>
        <button class="menu-button" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="drawer">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <h1>Aster451 Template Docs</h1>
    </header>

    <div class="backdrop" id="backdrop"></div>

    <nav class="drawer" id="drawer" aria-label="メニュー">

        <h2 class="drawer-title">Aster451 Template Licence</h2>

        <ul>
            <li>
                <a href="#licence">Licence</a>
            </li>
        </ul>

    </nav>

    <main id="content">

        <h1>Aster451 Template Licence</h1>

        <p>
            Aster451 Templateのライセンスです。Aster451 TemplateはMITライセンスの下で提供されています。詳細については、以下のリンクをご覧ください。
        </p>

        <p>
            Aster451 Templateのホームページはこちらから。
        </p>
        <a href="./">
            <button class="button">
                → Aster451 Template
            </button>
        </a>

        <section id="licence">

            <h2 class="theme-title">Licence</h2>

            <div class="blockquote">
                <p id="license">
                    ライセンスを読み込み中...
                </p>
            </div>
        </section>

    </main>
    <footer>
        <small>
            Aster451 Template
        </small>
    </footer>
</body>

<script>
    (async function () {

        const element = document.getElementById('license');

        if (!element) {
            return;
        }

        try {

            const response = await fetch(
                'https://api.github.com/repos/OWNER/REPOSITORY/license',
                {
                    headers: {
                        'Accept': 'application/vnd.github+json'
                    }
                }
            );

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();

            const link = document.createElement('a');

            link.href = data.html_url;
            link.textContent = data.name;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';

            element.textContent = 'License: ';
            element.appendChild(link);

        } catch (error) {

            console.error(
                'GitHubからライセンス情報を取得できませんでした:',
                error
            );

            element.textContent =
                'ライセンス情報を取得できませんでした。';

        }

    })();
</script>

</html>
